name: Build OSASTREAM 4K APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Flutter Project & Packages
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            flutter create --org com.osastream.app --project-name osastream_4k temp_project
            cp -r temp_project/* .
            rm -rf temp_project
          fi
          if [ -f "main_app.dart" ]; then
            cp main_app.dart lib/main.dart
            # استخراج جميع المكاتب المذكورة في الكود وتثبيتها تلقائياً
            PACKAGES=$(grep -oP "import 'package:\K[^/']+" lib/main.dart | grep -v "^flutter$" | grep -v "^osastream_4k$" | sort -u | tr '\n' ' ')
            if [ ! -z "$PACKAGES" ]; then
              echo "Installing packages: $PACKAGES"
              flutter pub add $PACKAGES
            fi
          fi

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OSASTREAM-4K-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
