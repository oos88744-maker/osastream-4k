name: Build OSASTREAM 4K APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter Project Structure
        run: |
          flutter create --org com.osama.osastream --project-name osastream_4k .
          flutter pub add http video_player chewie shared_preferences

      - name: Inject OSASTREAM 4K Code
        run: |
          if [ -f "main_app.dart" ]; then
            cp main_app.dart lib/main.dart
          fi

      - name: Force Landscape & Internet Permissions in AndroidManifest
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:launchMode="singleTop"/android:launchMode="singleTop" android:screenOrientation="sensorLandscape" android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload OSASTREAM_4K.apk
        uses: actions/upload-artifact@v4
        with:
          name: OSASTREAM-4K-PRO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
